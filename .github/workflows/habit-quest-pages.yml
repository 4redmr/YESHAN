# Publishes only the habit-quest/ folder to GitHub Pages: https://4redmr.github.io/YESHAN/
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy habit-quest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'habit-quest/**'
      - '.github/workflows/habit-quest-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: habit-quest
      - id: deployment
        uses: actions/deploy-pages@v4
